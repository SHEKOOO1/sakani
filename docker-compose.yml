version: '3.8'

services:
  app:
    # P0-3 (deploy): the CI pipeline builds and pushes this image to GHCR.
    # Declaring `image` (alongside `build`) lets the server `docker compose pull
    # app` and run the exact pushed build via `up -d --no-build`; otherwise the
    # deploy command would silently REBUILD from whatever stale source sits in
    # /opt/sakani. APP_IMAGE is provided by the deploy job (defaults to latest).
    image: ${APP_IMAGE:-ghcr.io/shekooo1/sakani:latest}
    build: .
    expose:
      - "3000"
    env_file: .env
    environment:
      # P0-3: hard-force production mode. Compose precedence is
      # `environment` > `env_file` > Dockerfile ENV, so a developer's local
      # .env (which sets NODE_ENV=development) can never downgrade the
      # deployed container. Local dev runs via `npm run dev` (or the explicit
      # docker-compose.dev.yml override), never through this production file.
      NODE_ENV: production
    depends_on:
      # P0-RT-2: wait for a *healthy* SQL Server, not merely a started
      # container. Without this the app can initialize before the database is
      # accepting connections, fail, and leave a hung container.
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      # P0-4: container initialization only — the application NEVER connects as
      # `sa` (it uses DB_USER/DB_PASSWORD). Required with NO fallback password;
      # docker compose fails closed when MSSQL_SA_PASSWORD is unset.
      SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set}"
      MSSQL_DB: "${DB_NAME:-DormMaster}"
    # P0-RT-2: readiness probe consumed by the app's
    # `depends_on: db: condition: service_healthy`.
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -C -Q 'SELECT 1' -b || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -C -Q 'SELECT 1' -b"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # P0-4: SQL Server is NOT published to the host in production. The app
    # reaches it over the internal Docker network (DB_HOST=db, port 1433).
    # Host access for local development is provided by docker-compose.dev.yml.
    volumes:
      - mssql_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  mssql_data:
